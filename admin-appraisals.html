<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FacultyTrack | Submitted Appraisals</title>

<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #f1f5fb; color: #20334f; }
header { background: #153e75; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
header h2 { margin: 0; font-size: 20px; }
header a { color: white; font-size: 13px; text-decoration: none; border: 1px solid white; padding: 7px 12px; border-radius: 6px; }
.container { max-width: 950px; margin: auto; padding: 18px; }
.panel { background: white; padding: 18px; border-radius: 12px; }
input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccd6e5; border-radius: 7px; font-size: 14px; }
button { border: none; padding: 10px 14px; border-radius: 7px; background: #1763b1; color: white; font-size: 13px; margin-top: 8px; }
button:disabled { opacity: .6; }
.approve { background: #198754; }
.reject { background: #dc3545; }
.card { border: 1px solid #e0e8f2; padding: 14px; border-radius: 10px; margin-top: 12px; }
.card h3 { margin: 0 0 6px; }
.badge { display: inline-block; padding: 5px 9px; border-radius: 15px; font-size: 12px; background: #fff0ce; color: #956000; }
.badge.Approved { background: #d8f5e4; color: #14723b; }
.badge.Correction { background: #fde2e4; color: #a12330; }
.detail { color: #718096; font-size: 13px; line-height: 1.7; }
.actions { display: flex; flex-wrap: wrap; gap: 7px; }
.actions button { flex: 1; }
.full { display: none; margin-top: 10px; padding: 12px; background: #f6f9fd; border-radius: 8px; font-size: 13px; line-height: 1.6; }
.full.open { display: block; }
.full div { border-bottom: 1px solid #e0e8f2; padding: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.full div:last-child { border-bottom: none; }
#msg { font-size: 13px; color: #1763b1; margin: 8px 0 0; overflow-wrap: anywhere; }
footer { text-align: center; padding: 25px; color: #718096; font-size: 12px; }
</style>
</head>

<body>

<header>
  <h2>SUBMITTED APPRAISALS</h2>
  <a href="admin.html">← Admin Panel</a>
</header>

<div class="container">
<div class="panel">
  <input type="text" id="search" placeholder="Search faculty name or employee ID...">
  <select id="sort">
    <option value="name">Sort by Name</option>
    <option value="empid">Sort by Employee ID</option>
    <option value="date">Sort by Date of Submission</option>
  </select>
  <button id="allPdfBtn" type="button">Download PDF of All Shown</button>
  <p id="msg"></p>
  <div id="list"><p>Loading...</p></div>
</div>
</div>

<footer>FacultyTrack © 2026 | Administrator Portal</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="module">
import {
  auth, db, signOut, onAuthStateChanged,
  doc, getDoc, collection, getDocs, updateDoc
} from "./firebase.js";

const $ = (id) => document.getElementById(id);

const LABELS = [
  ["designation","Designation"], ["joining","Date of Joining"], ["qualification","Qualification"],
  ["experience","Experience (years)"], ["courses","Courses Taught"], ["hours","Teaching Hours / Week"],
  ["feedback","Student Feedback (out of 10)"], ["passpct","Pass Percentage"],
  ["research","Research Summary"], ["patents","Patents / Grants / Projects"],
  ["admin","Administrative & Community"], ["rating","Self Rating (1-5)"],
  ["strengths","Strengths & Achievements"], ["goals","Goals Next Year"], ["training","Training Needs"]
];

let items = [];
const open = new Set();

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function ms(a) { return a.submittedAt && a.submittedAt.toMillis ? a.submittedAt.toMillis() : 0; }
function dateOf(a) { const m = ms(a); return m ? new Date(m).toISOString().slice(0, 10) : "-"; }
function cls(s) { return s === "Approved" ? "badge Approved" : s === "Correction Required" ? "badge Correction" : "badge"; }

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = "admin-login.html"; return; }
  try {
    const snap = await getDoc(doc(db, "faculty", user.uid));
    if (!snap.exists() || snap.data().role !== "admin") {
      await signOut(auth);
      window.location.href = "admin-login.html";
      return;
    }
    await load();
  } catch (e) {
    console.error(e);
    $("list").textContent = "Error: " + e.message;
  }
});

async function load() {
  const r = await getDocs(collection(db, "appraisals"));
  items = r.docs.map((d) => ({ id: d.id, ...d.data() })).filter((a) => a.status && a.status !== "Draft");
  show();
}

function visible() {
  const q = $("search").value.toLowerCase().trim();
  const s = $("sort").value;
  const r = items.filter((a) =>
    String(a.name || "").toLowerCase().includes(q) || String(a.employee_id || "").toLowerCase().includes(q));
  if (s === "name") r.sort((a, b) => String(a.name).localeCompare(String(b.name)));
  if (s === "empid") r.sort((a, b) => String(a.employee_id).localeCompare(String(b.employee_id)));
  if (s === "date") r.sort((a, b) => ms(b) - ms(a));
  return r;
}

function fullHtml(a) {
  const c = a.counts || {};
  let h = `<div><b>Activity counts:</b> Teaching ${c.Teaching || 0}, Research ${c.Research || 0}, Seminars ${c.Seminars || 0}, Projects ${c.Projects || 0}, Events ${c.Events || 0}</div>`;
  LABELS.forEach(([k, label]) => { h += `<div><b>${esc(label)}:</b> ${esc(a[k] || "-")}</div>`; });
  if (a.adminRemark) h += `<div><b>Admin remark:</b> ${esc(a.adminRemark)}</div>`;
  return h;
}

function show() {
  const r = visible();
  $("list").innerHTML = r.map((a) => `
<div class="card">
  <h3>${esc(a.name)}</h3>
  <span class="${cls(a.status)}">${esc(a.status)}</span>
  <p class="detail">
    Employee ID: ${esc(a.employee_id)}<br>
    Department: ${esc(a.department)}<br>
    Academic Year: ${esc(a.academicYear)}<br>
    Date of Submission: ${dateOf(a)}
  </p>
  <div class="actions">
    <button data-act="view" data-id="${esc(a.id)}">View Form</button>
    <button class="approve" data-act="approve" data-id="${esc(a.id)}">Approve</button>
    <button class="reject" data-act="correct" data-id="${esc(a.id)}">Request Correction</button>
    <button data-act="pdf" data-id="${esc(a.id)}">Download PDF</button>
  </div>
  <div class="full${open.has(a.id) ? " open" : ""}" id="f-${esc(a.id)}">${fullHtml(a)}</div>
</div>`).join("") || "<p>No submitted appraisals yet.</p>";
}

async function setStatus(a, status, remark) {
  $("msg").textContent = "Updating...";
  try {
    await updateDoc(doc(db, "appraisals", a.id), { status, adminRemark: remark });
    await load();
    $("msg").textContent = a.name + ": " + status;
  } catch (e) {
    console.error(e);
    $("msg").textContent = "Update failed: " + e.message;
  }
}

function pdfOne(pdf, a) {
  let y = 20;
  const pageH = pdf.internal.pageSize.getHeight();
  const w = pdf.internal.pageSize.getWidth() - 30;
  function line(t, size = 11, bold = false) {
    pdf.setFontSize(size);
    pdf.setFont("helvetica", bold ? "bold" : "normal");
    pdf.splitTextToSize(String(t), w).forEach((p) => {
      if (y > pageH - 15) { pdf.addPage(); y = 20; }
      pdf.text(p, 15, y);
      y += size * 0.5 + 2;
    });
  }
  line("FACULTY SELF-APPRAISAL FORM", 16, true);
  y += 2;
  line("Name: " + a.name, 13, true);
  line("Employee ID: " + a.employee_id);
  line("Department: " + a.department);
  line("Academic Year: " + a.academicYear);
  line("Status: " + a.status + "   |   Submitted: " + dateOf(a));
  const c = a.counts || {};
  line(`Activities: Teaching ${c.Teaching || 0}, Research ${c.Research || 0}, Seminars ${c.Seminars || 0}, Projects ${c.Projects || 0}, Events ${c.Events || 0}`);
  y += 3;
  LABELS.forEach(([k, label]) => { line(label + ":", 11, true); line("   " + (a[k] || "-"), 10); });
  if (a.adminRemark) { y += 2; line("Admin remark: " + a.adminRemark, 10); }
}

function makePdf(list, name) {
  if (!window.jspdf) { $("msg").textContent = "PDF library could not load. Check your internet."; return; }
  const pdf = new window.jspdf.jsPDF();
  list.forEach((a, i) => { if (i > 0) pdf.addPage(); pdfOne(pdf, a); });
  pdf.save(name);
}

$("list").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const a = items.find((x) => x.id === b.dataset.id);
  if (!a) return;
  const act = b.dataset.act;
  if (act === "view") {
    const box = document.getElementById("f-" + a.id);
    box.classList.toggle("open");
    if (box.classList.contains("open")) open.add(a.id); else open.delete(a.id);
  } else if (act === "approve") {
    setStatus(a, "Approved", "");
  } else if (act === "correct") {
    const r = prompt("Remark for " + a.name + " (what should be corrected?):");
    if (r === null) return;
    setStatus(a, "Correction Required", r.trim());
  } else if (act === "pdf") {
    makePdf([a], (a.employee_id || "faculty") + "_Appraisal_" + (a.academicYear || "") + ".pdf");
  }
});

$("allPdfBtn").addEventListener("click", () => {
  const r = visible();
  if (!r.length) { $("msg").textContent = "Nothing to download."; return; }
  makePdf(r, "All_Appraisal_Forms.pdf");
});

$("search").addEventListener("input", show);
$("sort").addEventListener("change", show);
</script>

</body>
  </html>
